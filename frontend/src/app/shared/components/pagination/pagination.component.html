<nav aria-label="Page navigation">
  <ul class="pagination">
    <!-- Кнопка Previous -->
    <li class="page-item" [class.disabled]="page === 1">
      <a class="page-link" href="#" (click)="prev(); $event.preventDefault()">Previous</a>
    </li>

    <!-- Список страниц -->
    <li
      *ngFor="let p of pages"
      class="page-item"
      [class.active]="p === page"
    >
      <a class="page-link" href="#" (click)="selectPage(p); $event.preventDefault()">{{ p }}</a>
    </li>

    <!-- Кнопка Next -->
    <li class="page-item" [class.disabled]="page === total">
      <a class="page-link" href="#" (click)="next(); $event.preventDefault()">Next</a>
    </li>
  </ul>
</nav>
