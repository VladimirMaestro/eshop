<div class="page-container">
  <aside class="sidebar p-3 border-end">
    <h5 class="fw-bold mb-4">Filters</h5>

    <div class="filter-group mb-4">
      <label class="form-label fw-medium mb-1">Minimum Price</label>
      <input name="priceMin" type="text" class="form-control filter-input" mask="00000" [(ngModel)]="priceMin" placeholder="0">
    </div>

    <div class="filter-group mb-4">
      <label class="form-label fw-medium mb-1">Maximum Price</label>
      <input name="priceMax" type="text" class="form-control filter-input" mask="00000" [(ngModel)]="priceMax" placeholder="10000">
    </div>

    <div class="filter-group mb-4">
      <label class="form-label fw-medium mb-2">Minimum Rating: {{ ratingMin || 0 }}</label>
      <input type="range" class="form-range custom-range"
             name="ratingMin"
             min="0"
             max="5"
             step="1"
             [(ngModel)]="ratingMin">
    </div>

    <button type="button" (click)="applyFilters()" class="btn btn-primary w-100 py-2 fw-medium apply-btn">
      Apply filters
    </button>
  </aside>

  <main class="main p-4">
    <div class="active-filters mb-3 d-flex flex-wrap gap-2">
      <div *ngFor="let filterEntry of filterEntries">
        <ng-container [ngSwitch]="filterEntry.key">
          <div *ngSwitchCase="'minRating'" class="badge rounded-pill filter-badge">
            <span>Rating: {{ filterEntry.value }}+</span>
            <i class="bi bi-x-circle-fill ms-2 remove-btn" (click)="removeFilter(filterEntry)"></i>
          </div>
          <div *ngSwitchCase="'minPrice'" class="badge rounded-pill filter-badge">
            <span>From: ${{ filterEntry.value }}</span>
            <i class="bi bi-x-circle-fill ms-2 remove-btn" (click)="removeFilter(filterEntry)"></i>
          </div>
          <div *ngSwitchCase="'maxPrice'" class="badge rounded-pill filter-badge">
            <span>To: ${{ filterEntry.value }}</span>
            <i class="bi bi-x-circle-fill ms-2 remove-btn" (click)="removeFilter(filterEntry)"></i>
          </div>
          <div *ngSwitchCase="'query'" class="badge rounded-pill filter-badge">
            <span>"{{ filterEntry.value }}"</span>
            <i class="bi bi-x-circle-fill ms-2 remove-btn" (click)="removeFilter(filterEntry)"></i>
          </div>
        </ng-container>
      </div>
    </div>

    <app-products-list></app-products-list>

    <div class="mt-5 d-flex justify-content-center">
      <app-pagination *ngIf="totalPages"
                      [page]="currentPage"
                      [total]="totalPages"
                      [visiblePages]="10"
                      (pageChange)="onPageChange($event)">
      </app-pagination>
    </div>
  </main>
</div>
