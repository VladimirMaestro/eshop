

<div class="container py-5">
  <h2 class="mb-4">🛒 Ваша корзина</h2>

  <div class="row">
    <!-- Список товаров -->
    <div class="col-lg-8">
      <app-cart-item [item]="item" *ngFor="let item of cartItems; trackBy: trackByCartItemId"></app-cart-item>
      <!-- Повторить блок товара для каждого -->
    </div>

    <!-- Итог -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Итого</h4>

          <div class="d-flex justify-content-between">
            <span>Товары</span>
            <span>₴999</span>
          </div>

          <div class="d-flex justify-content-between">
            <span>Доставка</span>
            <span>₴0</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between fw-bold">
            <span>Всего</span>
            <span>₴999</span>
          </div>

          <button class="btn btn-primary w-100 mt-3">
            Оформить заказ
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
