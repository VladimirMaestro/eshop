@let _item = item();

<div class="card mb-3 shadow-sm">
  <div class="row g-0 align-items-center">
    <div class="col-md-3">
      <img src="https://via.placeholder.com/150" class="img-fluid rounded-start" alt="Товар">
    </div>
    <div class="col-md-9">
      <div class="card-body">
        <h5 class="card-title">{{ _item.product.name }}</h5>

        <p class="card-text text-muted">описание</p>

        <div class="d-flex justify-content-between align-items-center">

          <!-- Количество -->
          <div class="input-group" style="width: 120px;">
            <button class="btn btn-outline-secondary" (click)="decrementAmount()">-</button>
            <input type="text" class="form-control text-center" [value]="_item.amount">
            <button class="btn btn-outline-secondary" (click)="incrementAmount()">+</button>
          </div>

          <!-- Цена -->
          <h5 class="mb-0">{{ _item.product.price }}</h5>

          <!-- Удалить -->
          <button class="btn btn-outline-danger btn-sm" (click)="remove()">Удалить</button>

        </div>
      </div>
    </div>
  </div>
</div>
