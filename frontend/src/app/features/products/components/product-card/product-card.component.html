<div class="card h-100 product-card shadow-sm">
  <div class="product-image-bg">
    <img [src]="product.image || DEFAULT_IMAGE"
         class="card-img-top product-image" [alt]="product.name">
  </div>
  <div class="card-body d-flex flex-column p-3">
    <h6 class="card-title fw-bold mb-1">{{product.name}}</h6>
    <p class="card-text text-muted small mb-2 description-truncate">
      {{product.description || 'High quality product with excellent features and great value for money'}}
    </p>

    <div class="rating-container d-flex align-items-center mb-2">
      <div class="stars me-1">
        <span *ngFor="let i of [1,2,3,4,5]" class="star-icon" [class.filled]="i <= product.rating">★</span>
      </div>
      <span class="text-muted small">({{product.comments?.length || 0}})</span>
    </div>

    <div class="mt-auto">
      <h4 class="fw-bold mb-3">${{product.price}}</h4>
      <div class="d-grid gap-2">
        <a [routerLink]="['/products', product.id]" class="btn btn-outline-primary py-2 fw-medium details-btn">
          More details
        </a>
        <button class="btn btn-primary py-2 d-flex align-items-center justify-content-center gap-2 add-to-cart-btn" (click)="addToCart()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
          </svg>
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
